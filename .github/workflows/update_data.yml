name: Update JP Data

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-jp-data
  cancel-in-progress: false

jobs:
  fetch-build-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt

      - name: Fetch and build Japan panel
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          JP_START: 1990-01-01
          FRED_SLEEP: '0.2'
        run: |
          python scripts/fetch_jp_raw.py
          python scripts/01_build_features.py
          python scripts/02_compute_indicators.py jp
          python scripts/03_make_report.py

      - name: Validate publication data
        run: python scripts/27_validate_site_data.py --regions jp --min-rows 8 --max-age-days 550

      - name: Create or update the JP data pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ci/update-jp-data
          delete-branch: true
          title: "chore(data): refresh Japan indicators"
          commit-message: "chore(data): refresh Japan indicators"
          body: |
            ## Summary

            - Refresh the official Japan source mirrors.
            - Rebuild and validate the Japan indicator panel.

            ## Testing

            - python scripts/02_compute_indicators.py jp
            - python scripts/27_validate_site_data.py --regions jp --min-rows 8 --max-age-days 550
          add-paths: |
            data/**
