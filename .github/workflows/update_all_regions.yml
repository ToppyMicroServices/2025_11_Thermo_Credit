name: Update All Regions Data

on:
  workflow_dispatch: {}
  schedule:
    - cron: '30 3 * * 1-5'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-all-regions
  cancel-in-progress: false

jobs:
  fetch-build-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt

      - name: Fetch official source series
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          JP_START: 1990-01-01
          OBS_START: 1990-01-01
          FRED_SLEEP: '0.2'
        run: |
          python scripts/fetch_ecb_series.py --start 1999-01
          python scripts/fetch_fred_series.py --start "${OBS_START}"
          python scripts/fetch_jp_raw.py

      - name: Rebuild regional feature tables
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          THERMO_USE_CACHED_SERIES: '1'
        run: |
          python scripts/01_build_features.py
          python scripts/04_build_features_eu.py
          python scripts/05_build_features_us.py

      - name: Build indicators and report
        env:
          REPORT_PLOT_START: 1998-01-01
        run: |
          python scripts/02_compute_all_regions.py
          python scripts/03_make_report.py

      - name: Validate publication data
        run: |
          python scripts/27_validate_site_data.py --min-rows 8 --max-age-days 550

      - name: Create or update the single data pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ci/update-all-regions
          delete-branch: true
          title: "chore(data): refresh regional indicators"
          commit-message: "chore(data): refresh regional indicators"
          body: |
            ## Summary

            - Refresh official JP, EU, and US source series.
            - Rebuild regional feature and indicator panels.
            - Validate schema, row counts, ordering, and data freshness.

            ## Testing

            - python scripts/02_compute_all_regions.py
            - python scripts/03_make_report.py
            - python scripts/27_validate_site_data.py --min-rows 8 --max-age-days 550
          add-paths: |
            data/**
            site/indicators_eu.csv
            site/indicators_us.csv
